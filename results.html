<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Triage result summary from the HealthTriage AI assessment prototype." />
    <title>HealthTriage AI | Triage Results</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body data-page="results">
    <header class="site-header">
      <div class="container nav-wrap">
        <a href="index.html" class="brand" aria-label="HealthTriage AI home">
          <span class="brand-mark">+</span>
          <span class="brand-copy">
            <strong>HealthTriage</strong>
            <small>AI</small>
          </span>
        </a>

        <nav class="main-nav" aria-label="Main navigation">
          <a href="index.html">Home</a>
          <a href="how-it-works.html">How It Works</a>
          <a href="assessment.html">Assessment</a>
          <a href="history.html">History</a>
        </nav>

        <button type="button" class="theme-toggle" aria-pressed="false" aria-label="Switch to dark mode"></button>
        <a href="assessment.html" class="button button-primary nav-cta">Start Again</a>
      </div>
    </header>

    <main>
      <section class="section result-section">
        <div class="container result-wrap">
          <div id="resultContainer" class="card result-card">
            <p class="eyebrow">Triage recommendation</p>
            <h1>Loading result...</h1>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-grid">
        <div>
          <a href="index.html" class="brand footer-brand">
            <span class="brand-mark">+</span>
            <span class="brand-copy">
              <strong>HealthTriage</strong>
              <small>AI</small>
            </span>
          </a>
        </div>
        <div>
          <p class="small-text">The result shown here is a prototype triage recommendation and not a diagnosis.</p>
        </div>
      </div>
    </footer>
  </body>
</html>
